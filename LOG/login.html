
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

    <!-- Fonte -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


    <title>Login</title>

    <style>
        body,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: "Montserrat", sans-serif;
        }

        .w3-sidebar {
            width: 120px;
            background: #222;
        }

        #main {
            margin-left: 120px;
        }

        @media only screen and (max-width: 600px) {
            #main {
                margin-left: 0;
            }
        }

        /* Área do login */
        .login-container {
            max-width: 500px;
            margin: auto;
        }

        .login-container input[type="email"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 8px 0 15px;
            border: none;
        }

        .login-container button {
            width: 100%;
            margin-top: 15px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
        }

        #mensagem-container {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>

</head>


<body class="w3-black">


    <!-- MENU LATERAL -->

    <nav class="w3-sidebar w3-bar-block w3-small w3-hide-small w3-center">


        <a href="#inicio" class="w3-bar-item w3-button w3-padding-large w3-black">

            <i class="fa fa-home w3-xxlarge"></i>

            <p>INÍCIO</p>

        </a>


        <a href="#login" class="w3-bar-item w3-button w3-padding-large w3-hover-black">

            <i class="fa fa-sign-in w3-xxlarge"></i>

            <p>LOGIN</p>

        </a>


        <a href="index.html" class="w3-bar-item w3-button w3-padding-large w3-hover-black">

            <i class="fa fa-user-plus w3-xxlarge"></i>

            <p>CADASTRO</p>

        </a>


        <a href="#contato" class="w3-bar-item w3-button w3-padding-large w3-hover-black">

            <i class="fa fa-envelope w3-xxlarge"></i>

            <p>CONTATO</p>

        </a>


    </nav>



    <!-- MENU PARA CELULAR -->

    <div class="w3-top w3-hide-large w3-hide-medium">

        <div class="w3-bar w3-black w3-center w3-small">


            <a href="#inicio" class="w3-bar-item w3-button" style="width:25%">
                INÍCIO
            </a>


            <a href="#login" class="w3-bar-item w3-button" style="width:25%">
                LOGIN
            </a>


            <a href="index.html" class="w3-bar-item w3-button" style="width:25%">
                CADASTRO
            </a>


            <a href="#contato" class="w3-bar-item w3-button" style="width:25%">
                CONTATO
            </a>


        </div>

    </div>



    <!-- CONTEÚDO PRINCIPAL -->

    <div class="w3-padding-large" id="main">


        <!-- INÍCIO -->

        <header class="w3-container w3-padding-64 w3-center" id="inicio">


            <h1 class="w3-jumbo">
                Bem-vindo
            </h1>


            <p>
                Acesse sua conta para continuar.
            </p>


            <i class="fa fa-user-circle w3-jumbo"></i>


        </header>



        <!-- LOGIN -->

        <div class="w3-content w3-padding-64 login-container" id="login">


            <h2 class="w3-text-light-grey">
                Login
            </h2>


            <hr style="width:150px" class="w3-opacity">



            <!-- FORMULÁRIO DE LOGIN -->

            <form id="formulario-login">


                <!-- E-MAIL -->

                <h6>
                    Usuário (E-mail)
                </h6>


                <div class="input-box">

                    <input id="email" name="email" placeholder="Usuário (E-mail)" type="email" required>

                    <i class="fa fa-user"></i>

                </div>



                <!-- SENHA -->

                <h6>
                    Senha
                </h6>


                <div class="input-box">

                    <input id="password" name="password" placeholder="Senha" type="password" required>

                    <i class="fa fa-lock"></i>

                </div>



                <!-- LEMBRAR SENHA -->

                <div class="remember-forgot">


                    <label>

                        <input type="checkbox">

                        Lembrar senha

                    </label>


                    <a href="#">
                        Esqueci senha
                    </a>


                </div>



                <!-- BOTÃO LOGIN -->

                <button type="submit" class="login w3-button w3-light-grey w3-padding-large">

                    <i class="fa fa-sign-in"></i>

                    Login

                </button>



                <!-- MENSAGEM -->

                <div id="mensagem-container" style="margin-top: 15px; font-weight: bold; text-align: center;">

                </div>



                <!-- CADASTRO -->

                <div class="register-link">


                    <p>

                        Não tem uma conta?

                        <a href="index.html">
                            Cadastre-se
                        </a>

                    </p>


                </div>


            </form>


        </div>



        <!-- CONTATO -->

        <div class="w3-content w3-padding-64 w3-text-grey" id="contato">


            <h2 class="w3-text-light-grey">
                Contato
            </h2>


            <hr style="width:200px" class="w3-opacity">


            <p>
                Entre em contato para mais informações.
            </p>


            <p>

                <i class="fa fa-envelope fa-fw w3-text-white w3-xlarge"></i>

                Email: contato@exemplo.com

            </p>


        </div>



        <!-- RODAPÉ -->

        <footer class="w3-content w3-padding-64 w3-text-grey w3-xlarge">


            <i class="fa fa-facebook-official w3-hover-opacity"></i>

            <i class="fa fa-instagram w3-hover-opacity"></i>

            <i class="fa fa-twitter w3-hover-opacity"></i>

            <i class="fa fa-linkedin w3-hover-opacity"></i>


            <p class="w3-medium">

                Sistema de Controle

            </p>


        </footer>


    </div>



    <!-- JAVASCRIPT -->

    <script src="log.js"></script>


</body>

</html>
